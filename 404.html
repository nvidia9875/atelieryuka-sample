<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ページが見つかりません | Atelier Yuka</title>
<meta name="theme-color" content="#FBF9F5">
<link rel="icon" href="/atelieryuka-sample/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500&amp;family=Shippori+Mincho:wght@400;500&amp;family=Noto+Sans+JP:wght@300;400&amp;display=swap">
<style>
  :root {
    --ivory: #FBF9F5;
    --ink: #2B2724;
    --gold: #B49B57;
    --gold-ink: #7A6027;
    --muted: #6B645C;
    --font-en: "Cormorant Garamond", Georgia, serif;
    --font-jp: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    display: grid;
    place-content: center;
    gap: 1.4rem;
    padding: clamp(24px, 8vw, 72px);
    background: var(--ivory);
    color: var(--ink);
    font: 300 1rem/1.95 var(--font-body);
    text-align: center;
  }
  .mark { font: italic 400 clamp(3rem, 2rem + 5vw, 5rem)/1 var(--font-en); color: var(--gold-ink); }
  .fleuron {
    width: 7px; height: 7px;
    margin: 0.4rem auto;
    border: 1px solid var(--gold);
    transform: rotate(45deg);
  }
  h1 { font: 500 clamp(1.2rem, 1rem + 1vw, 1.6rem)/1.8 var(--font-jp); text-wrap: balance; }
  p { color: var(--muted); font-size: 0.9rem; text-wrap: pretty; }
  a.btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 52px;
    margin-top: 0.6rem;
    padding: 0.85em 2.1em;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--ivory);
    font: 400 0.95rem/1.4 var(--font-body);
    text-decoration: none;
    transition: background-color 0.18s ease-out, border-color 0.18s ease-out;
  }
  a.btn:hover { background: var(--gold-ink); border-color: var(--gold-ink); }
  a.btn:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
</style>
</head>
<body>
  <p class="mark" aria-hidden="true" translate="no">404</p>
  <div class="fleuron" aria-hidden="true"></div>
  <h1>お探しのページが見つかりませんでした</h1>
  <p>URLが変更されたか、削除された可能性があります。<br>トップページからお探しください。</p>
  <p><a class="btn" href="/atelieryuka-sample/">トップページへ戻る</a></p>
</body>
</html>
